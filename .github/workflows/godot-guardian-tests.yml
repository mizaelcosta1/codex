name: Godot guardian integration checks

on:
  workflow_dispatch:
  push:
    branches:
      - feature/guardians-v0.2-asset-pipeline
    paths:
      - '.github/workflows/godot-guardian-tests.yml'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/guardians/**'
      - 'tests/**'
      - 'project.godot'
      - 'assets/video/**'
  pull_request:
    paths:
      - '.github/workflows/godot-guardian-tests.yml'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/guardians/**'
      - 'tests/**'
      - 'project.godot'

permissions:
  contents: read

jobs:
  godot-smoke:
    name: Import GLBs and run gameplay regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Import all project GLBs
        run: Godot_v4.6.3-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Check guardian catalog
        run: Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/test_guardian_asset_catalog.gd
      - name: Check five guardian models and animations
        run: Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/test_guardian_showcase.gd
      - name: Validate video loading screen
        run: Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/test_loading_screen.gd
      - name: Run original gameplay regression suite
        run: Godot_v4.6.3-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tests/test_game.gd
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-guardian-test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: build/*.json
