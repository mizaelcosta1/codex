name: Colab SSH bridge static checks
on:
  workflow_dispatch:
  push:
    branches:
      - feature/guardians-v0.2-asset-pipeline
    paths:
      - 'tools/colab_ssh_preflight.sh'
      - 'tools/colab_remote_probe.py'
      - 'docs/COLAB_SSH_ACCESS.md'
      - '.github/workflows/colab-ssh-static-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n tools/colab_ssh_preflight.sh
      - name: Validate Python and local read-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/colab_remote_probe.py
          python3 tools/colab_remote_probe.py > /tmp/ratanaba-colab-probe.json
          python3 -c 'import json; d=json.load(open("/tmp/ratanaba-colab-probe.json")); assert d["report"] == "ratanaba_colab_ssh_probe_v1"; assert d["system"] == "Linux"; print("LOCAL_STATIC_PROBE_PASS")'
