name: Ratanaba 2D RPG Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ratanaba-2d/**'
      - '.github/workflows/ratanaba-2d-android.yml'
  push:
    branches: [main, feature/ratanaba-2d-rpg-android]
    paths:
      - 'ratanaba-2d/**'
      - '.github/workflows/ratanaba-2d-android.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit and deterministic engine tests
        working-directory: ratanaba-2d
        run: |
          node web/tests/test_elemental_unit.cjs
          node web/tests/preflight.cjs
          node web/tests/test_engine_regressions.cjs
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          node web/tests/test_rpg_unit.cjs
          node web/tests/test_animation_unit.cjs
          node web/tests/test_native_bridge.cjs
          node --check web/native-bridge.js
      - name: Install browser test tooling outside source
        run: |
          mkdir -p "$RUNNER_TEMP/browser-tests"
          npm install --prefix "$RUNNER_TEMP/browser-tests" playwright@1.63.0
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/browser-tests/node_modules" >> "$GITHUB_ENV"
      - name: Browser combat, HUD and RPG regression tests
        working-directory: ratanaba-2d
        run: |
          node web/tests/test_hud_v04.cjs
          node web/tests/test_game.cjs
          node web/tests/test_v03.cjs
          node web/tests/test_rpg_v05.cjs
      - name: Ensure Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.1'
      - name: Build and verify signed offline APK
        working-directory: ratanaba-2d
        run: python3 tools/build_android.py --sdk "$ANDROID_SDK_ROOT" --keystore "$RUNNER_TEMP/ratanaba-debug.jks"
      - name: Upload installable development APK and validation
        uses: actions/upload-artifact@v4
        with:
          name: ratanaba-guardians-2d-v0.6.0-android-debug
          if-no-files-found: error
          retention-days: 30
          path: |
            ratanaba-2d/build/android/*.apk
            ratanaba-2d/build/android/SHA256SUMS.txt
            ratanaba-2d/build/android/android_validation.json
            ratanaba-2d/build/android/signature.txt
            ratanaba-2d/build/android/badging.txt
            ratanaba-2d/build/android/permissions.txt
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratanaba-2d-browser-test-evidence
          if-no-files-found: warn
          retention-days: 14
          path: ratanaba-2d/web/tests/evidence/
