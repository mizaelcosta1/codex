name: Publish Genjutsu cinematic loading video

on:
  workflow_dispatch:
  push:
    branches:
      - feature/guardians-v0.2-asset-pipeline
    paths:
      - '.github/workflows/publish-genjutsu-loading.yml'

permissions:
  contents: write

jobs:
  publish-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve generated Genjutsu video (verified archive)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/genjutsu" assets/video
          curl --fail --location --retry 3 --silent --show-error \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3LlL6BKCfFvOjtBuZqUoEyJJaH3/6e5d5039-7594-4c8a-a151-044652e8cbda.zip' -o "$RUNNER_TEMP/genjutsu/source.zip"
          unzip -t "$RUNNER_TEMP/genjutsu/source.zip"
          unzip -q "$RUNNER_TEMP/genjutsu/source.zip" -d "$RUNNER_TEMP/genjutsu"
          echo '2c065cd739a4fa34b68040318bae275b5096422413b551751f7e459b06553a7a  ratanaba_loading.ogv' > "$RUNNER_TEMP/genjutsu/expected.txt"
          (cd "$RUNNER_TEMP/genjutsu" && sha256sum -c expected.txt)
          cp "$RUNNER_TEMP/genjutsu/ratanaba_loading.ogv" assets/video/ratanaba_loading.ogv
      - name: Validate Godot-compatible video
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 assets/video/ratanaba_loading.ogv)
          [ "$codec" = "theora" ]
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/video/ratanaba_loading.ogv
          test "$(stat -c %s assets/video/ratanaba_loading.ogv)" -lt 6000000
      - name: Commit cinematic video in development branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video/ratanaba_loading.ogv
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add free Genjutsu cinematic loading video [skip ci]'
            git push origin HEAD:feature/guardians-v0.2-asset-pipeline
          fi
      - name: Upload original MP4 and Godot OGV
        uses: actions/upload-artifact@v4
        with:
          name: ratanaba-genjutsu-loading-cinematic
          retention-days: 30
          path: |
            assets/video/ratanaba_loading.ogv
            ${{ runner.temp }}/genjutsu/genjutsu_loading_result.mp4
